<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="העוזר שלי">
<meta name="theme-color" content="#2C5347">
<title>העוזר שלי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Assistant:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #E9EFEA;
    --bg-2: #F3EFE6;
    --card: #FFFDF9;
    --ink: #22302A;
    --ink-soft: #6C7A72;
    --accent: #3D6B5C;
    --accent-dark: #274539;
    --accent-soft: #DCE8E2;
    --gold: #C99A3D;
    --gold-soft: #F3E6C8;
    --border: #E6E1D5;
    --danger: #B3554A;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background: linear-gradient(160deg, var(--bg) 0%, var(--bg-2) 100%);
    font-family:'Assistant', sans-serif;
    color: var(--ink);
    display:flex;
    justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  #app{
    width:100%;
    max-width:480px;
    height:100dvh;
    background:var(--card);
    display:flex;
    flex-direction:column;
    box-shadow: 0 8px 50px rgba(39,69,57,0.14);
    overflow:hidden;
  }

  /* Header */
  header{
    display:flex;
    align-items:center;
    gap:12px;
    padding:16px 18px;
    background: linear-gradient(135deg, var(--accent-dark), var(--accent));
    flex-shrink:0;
    position:relative;
  }
  .avatar{
    width:44px;
    height:44px;
    border-radius:50%;
    background:rgba(255,255,255,0.18);
    border:1.5px solid rgba(255,255,255,0.35);
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .avatar svg{width:23px;height:23px;}
  .brand{flex:1; min-width:0;}
  .brand h1{
    font-family:'Frank Ruhl Libre', serif;
    font-weight:700;
    font-size:19px;
    margin:0;
    color:#FFFDF9;
  }
  .brand p{
    margin:2px 0 0;
    font-size:12.5px;
    color:rgba(255,253,249,0.75);
  }
  .reset-btn{
    border:none;
    background:none;
    color:rgba(255,253,249,0.7);
    font-size:12px;
    font-family:'Assistant', sans-serif;
    cursor:pointer;
    padding:6px 8px;
    text-decoration:underline;
    text-underline-offset:2px;
    flex-shrink:0;
  }
  .reset-btn:hover{color:#fff;}
  .cal-btn{
    border:none;
    background:rgba(255,255,255,0.18);
    color:#FFFDF9;
    width:34px;
    height:34px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
  }
  .cal-btn svg{width:17px;height:17px;}

  /* Calendar modal */
  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(31,43,36,0.4);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    z-index:50;
  }
  .modal-overlay.hidden{display:none;}
  .modal{
    width:100%;
    max-width:480px;
    max-height:78vh;
    background:var(--card);
    border-radius:20px 20px 0 0;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .modal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 18px;
    border-bottom:1px solid var(--border);
    flex-shrink:0;
  }
  .modal-header h2{
    font-family:'Frank Ruhl Libre', serif;
    font-size:17px;
    margin:0;
    color:var(--accent-dark);
  }
  .modal-close{
    border:none;
    background:none;
    font-size:20px;
    line-height:1;
    color:var(--ink-soft);
    cursor:pointer;
    padding:4px 8px;
  }
  .modal-body{
    overflow-y:auto;
    padding:8px 18px 18px;
  }
  .modal-note{
    font-size:12px;
    color:var(--ink-soft);
    padding:6px 0 14px;
    line-height:1.6;
  }
  .modal-empty{
    text-align:center;
    color:var(--ink-soft);
    font-size:14px;
    padding:30px 10px;
  }
  .rlist-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 0;
    border-bottom:1px solid var(--border);
  }
  .rlist-item:last-child{border-bottom:none;}
  .rlist-text{flex:1; min-width:0;}
  .rlist-title{font-size:14.5px; color:var(--ink);}
  .rlist-title.done{text-decoration:line-through; opacity:.5;}
  .rlist-when{font-size:12px; color:var(--ink-soft); margin-top:2px;}
  .rlist-add{
    border:1px solid var(--accent);
    background:none;
    color:var(--accent-dark);
    font-size:12.5px;
    font-family:'Assistant', sans-serif;
    border-radius:999px;
    padding:6px 12px;
    cursor:pointer;
    white-space:nowrap;
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:5px;
  }
  .rlist-add:hover{background:var(--accent-soft);}
  .rlist-add svg{width:13px;height:13px;}
  .add-all-btn{
    width:100%;
    padding:11px;
    border-radius:12px;
    border:none;
    background:var(--accent);
    color:#fff;
    font-family:'Assistant', sans-serif;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    margin-bottom:6px;
  }
  .add-all-btn:hover{background:var(--accent-dark);}

  /* Agenda strip */
  #agenda{
    display:flex;
    gap:8px;
    padding:12px 16px;
    overflow-x:auto;
    background:var(--gold-soft);
    border-bottom:1px solid var(--border);
    flex-shrink:0;
    scrollbar-width:none;
  }
  #agenda::-webkit-scrollbar{display:none;}
  .agenda-empty{
    font-size:13px;
    color:var(--ink-soft);
    padding:6px 2px;
    white-space:nowrap;
  }
  .chip{
    display:flex;
    align-items:center;
    gap:6px;
    padding:7px 14px;
    border-radius:999px;
    background:#FFFDF9;
    color:var(--ink);
    font-size:13px;
    white-space:nowrap;
    cursor:pointer;
    box-shadow: 0 1px 3px rgba(39,69,57,0.12);
    flex-shrink:0;
    transition: opacity .15s ease, transform .1s ease;
  }
  .chip:active{transform:scale(0.97);}
  .chip .time{color:var(--accent-dark); font-weight:700;}
  .chip.done{
    opacity:.5;
    text-decoration:line-through;
  }

  /* Chat */
  #chat{
    flex:1;
    overflow-y:auto;
    padding:18px 16px;
    display:flex;
    flex-direction:column;
    gap:10px;
    background-image: radial-gradient(circle, rgba(61,107,92,0.06) 1px, transparent 1px);
    background-size: 16px 16px;
  }
  .row{display:flex; width:100%; animation: rise .25s ease;}
  .row-user{justify-content:flex-start;}
  .row-assistant{justify-content:flex-end;}
  @keyframes rise{
    from{opacity:0; transform:translateY(6px);}
    to{opacity:1; transform:translateY(0);}
  }
  .bubble{
    max-width:78%;
    padding:10px 15px;
    border-radius:17px;
    font-size:15px;
    line-height:1.5;
    white-space:pre-wrap;
    word-break:break-word;
    box-shadow: 0 1px 2px rgba(39,69,57,0.06);
  }
  .bubble-user{
    background:var(--accent-soft);
    color:var(--ink);
    border-bottom-right-radius:5px;
  }
  .bubble-assistant{
    background:#FFFDF9;
    border:1px solid var(--border);
    color:var(--ink);
    border-bottom-left-radius:5px;
  }
  .welcome{
    text-align:center;
    color:var(--ink-soft);
    font-size:14px;
    padding:20px 24px 10px;
    line-height:1.6;
  }
  .suggestions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
    padding:6px 16px 10px;
  }
  .sugg-chip{
    border:1px solid var(--accent);
    background:#FFFDF9;
    color:var(--accent-dark);
    font-family:'Assistant', sans-serif;
    font-size:13px;
    padding:8px 14px;
    border-radius:999px;
    cursor:pointer;
  }
  .sugg-chip:hover{background:var(--accent-soft);}
  .typing{
    display:flex;
    gap:4px;
    align-items:center;
    padding:12px 15px;
  }
  .typing span{
    width:6px;height:6px;border-radius:50%;
    background:var(--ink-soft);
    display:inline-block;
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2){animation-delay:.15s;}
  .typing span:nth-child(3){animation-delay:.3s;}
  @keyframes bounce{
    0%, 60%, 100%{transform:translateY(0); opacity:.5;}
    30%{transform:translateY(-4px); opacity:1;}
  }

  /* Input bar */
  #inputbar{
    display:flex;
    align-items:flex-end;
    gap:10px;
    padding:12px 16px;
    border-top:1px solid var(--border);
    flex-shrink:0;
    background:var(--card);
  }
  #textInput{
    flex:1;
    border:1px solid var(--border);
    border-radius:22px;
    padding:11px 17px;
    font-family:'Assistant', sans-serif;
    font-size:15px;
    resize:none;
    max-height:100px;
    line-height:1.4;
    background:#F7F4EC;
    color:var(--ink);
  }
  #textInput:focus{outline:2px solid var(--accent-soft);}
  #sendBtn{
    width:44px;
    height:44px;
    border-radius:50%;
    border:none;
    background:var(--accent);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    box-shadow: 0 2px 8px rgba(39,69,57,0.3);
    transition: background .15s ease, transform .1s ease;
  }
  #sendBtn:hover{background:var(--accent-dark);}
  #sendBtn:active{transform:scale(0.95);}
  #sendBtn:disabled{background:var(--ink-soft); box-shadow:none; cursor:default;}
  #sendBtn svg{width:19px;height:19px;}

  @media (prefers-reduced-motion: reduce){
    .typing span{animation:none;}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="avatar">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="10" stroke="#FFFDF9" stroke-width="1.6"/>
        <path d="M8 13.5C8.8 14.6 10.2 15.2 12 15.2C13.8 15.2 15.2 14.6 16 13.5" stroke="#FFFDF9" stroke-width="1.6" stroke-linecap="round"/>
        <circle cx="9" cy="9.5" r="1.1" fill="#FFFDF9"/>
        <circle cx="15" cy="9.5" r="1.1" fill="#FFFDF9"/>
      </svg>
    </div>
    <div class="brand">
      <h1>העוזר שלי</h1>
      <p id="dateLabel">טוען...</p>
    </div>
    <button class="cal-btn" id="notifBtn" aria-label="התראות">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M6 10.5C6 7 8.5 4.5 12 4.5C15.5 4.5 18 7 18 10.5C18 14.5 19.5 16 19.5 16H4.5C4.5 16 6 14.5 6 10.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M10 18.5C10.3 19.3 11.1 19.8 12 19.8C12.9 19.8 13.7 19.3 14 18.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </button>
    <button class="cal-btn" id="calBtn" aria-label="לוח שנה">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="3.5" y="5" width="17" height="15" rx="2.5" stroke="currentColor" stroke-width="1.6"/>
        <path d="M3.5 9.5H20.5" stroke="currentColor" stroke-width="1.6"/>
        <path d="M7.5 3.5V6.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M16.5 3.5V6.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </button>
    <button class="reset-btn" id="resetBtn">איפוס</button>
  </header>

  <div id="agenda"></div>

  <div id="chat"></div>

  <div id="inputbar">
    <textarea id="textInput" rows="1" placeholder="כתוב הודעה... למשל: תזכיר לי מחר ב-9 להתקשר לרופא"></textarea>
    <button id="sendBtn" aria-label="שלח">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M20 12L4 5L6.5 12L4 19L20 12Z" fill="white"/>
      </svg>
    </button>
  </div>
</div>

<div class="modal-overlay hidden" id="calModal">
  <div class="modal">
    <div class="modal-header">
      <h2>הוספה ליומן</h2>
      <button class="modal-close" id="calCloseBtn" aria-label="סגור">×</button>
    </div>
    <div class="modal-body">
      <p class="modal-note">כל פריט נפתח כקובץ שאייפון מזהה אוטומטית ומציע להוסיף ליומן שלך באפליקציית Calendar, כולל התראה מובנית בזמן המתאים — לחיצה אחת על הכפתור, ועוד לחיצה על "הוסף" במסך שנפתח.</p>
      <div id="calListContent"></div>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'assistant-state-v1';
let state = { messages: [], reminders: [], notified: [] };
let sending = false;

const chatEl = document.getElementById('chat');
const agendaEl = document.getElementById('agenda');
const dateLabelEl = document.getElementById('dateLabel');
const inputEl = document.getElementById('textInput');
const sendBtn = document.getElementById('sendBtn');
const resetBtn = document.getElementById('resetBtn');
const calBtn = document.getElementById('calBtn');
const calModal = document.getElementById('calModal');
const calCloseBtn = document.getElementById('calCloseBtn');
const calListContent = document.getElementById('calListContent');
const notifBtn = document.getElementById('notifBtn');

function uid(){
  return 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}

function isToday(iso){
  if(!iso) return false;
  const d = new Date(iso);
  const now = new Date();
  return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth() && d.getDate()===now.getDate();
}

function formatTime(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return d.toLocaleTimeString('he-IL', {hour:'2-digit', minute:'2-digit'});
}

async function loadState(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      if(parsed && typeof parsed === 'object'){
        state = { messages: parsed.messages || [], reminders: parsed.reminders || [], notified: parsed.notified || [] };
      }
    }
  }catch(e){
    // no saved state yet — start fresh
  }
  renderAll();
}

async function saveState(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(state), false);
  }catch(e){
    console.error('שמירה נכשלה', e);
  }
}

function greetingWord(){
  const h = new Date().getHours();
  if(h < 5) return 'לילה טוב';
  if(h < 12) return 'בוקר טוב';
  if(h < 18) return 'צהריים טובים';
  return 'ערב טוב';
}

function renderDateLabel(){
  const now = new Date();
  const dateTxt = now.toLocaleDateString('he-IL', {weekday:'long', day:'numeric', month:'long'});
  dateLabelEl.textContent = `${greetingWord()}, ${dateTxt}`;
}

function renderAgenda(){
  agendaEl.innerHTML = '';
  const todays = state.reminders
    .filter(r => isToday(r.datetime) || (r.allDay && isToday(r.datetime)))
    .sort((a,b) => (a.datetime||'').localeCompare(b.datetime||''));

  if(todays.length === 0){
    const empty = document.createElement('div');
    empty.className = 'agenda-empty';
    empty.textContent = 'אין לך שום דבר מתוכנן היום';
    agendaEl.appendChild(empty);
    return;
  }

  todays.forEach(r => {
    const chip = document.createElement('div');
    chip.className = 'chip' + (r.done ? ' done' : '');
    const timeTxt = r.allDay ? 'כל היום' : formatTime(r.datetime);
    chip.innerHTML = `<span class="time">${timeTxt}</span><span>${escapeHtml(r.text)}</span>`;
    chip.addEventListener('click', () => toggleReminder(r.id));
    agendaEl.appendChild(chip);
  });
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function toggleReminder(id){
  const r = state.reminders.find(x => x.id === id);
  if(r){
    r.done = !r.done;
    saveState();
    renderAgenda();
  }
}

function renderChat(){
  chatEl.innerHTML = '';
  if(state.messages.length === 0){
    const welcome = document.createElement('div');
    welcome.className = 'welcome';
    welcome.textContent = 'היי! אני העוזר שלך. אפשר להגיד לי מה לזכור, לשאול מה מתוכנן, או לבקש למחוק ולסמן דברים כבוצעו — אני אטפל בזה ואשמור הכול כאן.';
    chatEl.appendChild(welcome);

    const sugg = document.createElement('div');
    sugg.className = 'suggestions';
    const examples = ['תזכיר לי מחר ב-9 להתקשר לרופא', 'מה יש לי היום?', 'תזכיר לי לשלם ארנונה עד סוף החודש'];
    examples.forEach(text => {
      const chip = document.createElement('button');
      chip.className = 'sugg-chip';
      chip.textContent = text;
      chip.addEventListener('click', () => {
        inputEl.value = text;
        sendMessage();
      });
      sugg.appendChild(chip);
    });
    chatEl.appendChild(sugg);
    return;
  }
  state.messages.forEach(m => {
    const row = document.createElement('div');
    row.className = 'row ' + (m.role === 'user' ? 'row-user' : 'row-assistant');
    const bubble = document.createElement('div');
    bubble.className = 'bubble ' + (m.role === 'user' ? 'bubble-user' : 'bubble-assistant');
    bubble.textContent = m.content;
    row.appendChild(bubble);
    chatEl.appendChild(row);
  });
  chatEl.scrollTop = chatEl.scrollHeight;
}

function renderAll(){
  renderDateLabel();
  renderAgenda();
  renderChat();
}

function showTyping(on){
  const existing = document.getElementById('typingRow');
  if(on){
    if(existing) return;
    const row = document.createElement('div');
    row.className = 'row row-assistant';
    row.id = 'typingRow';
    row.innerHTML = '<div class="bubble bubble-assistant typing"><span></span><span></span><span></span></div>';
    chatEl.appendChild(row);
    chatEl.scrollTop = chatEl.scrollHeight;
  }else{
    if(existing) existing.remove();
  }
}

const WEEKDAY_NAMES = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];

function addDays(base, n){
  const d = new Date(base);
  d.setDate(d.getDate() + n);
  return d;
}

function findWeekday(text){
  for(let i = 0; i < WEEKDAY_NAMES.length; i++){
    if(text.includes('יום ' + WEEKDAY_NAMES[i])){
      const now = new Date();
      let diff = (i - now.getDay() + 7) % 7;
      if(diff === 0) diff = 7;
      return addDays(now, diff);
    }
  }
  return null;
}

function parseDateFromText(text){
  const now = new Date();
  if(text.includes('מחרתיים')) return addDays(now, 2);
  if(text.includes('מחר')) return addDays(now, 1);
  if(text.includes('היום')) return now;
  const wd = findWeekday(text);
  if(wd) return wd;
  let m = text.match(/בעוד\s*(\d+)\s*ימים/);
  if(m) return addDays(now, parseInt(m[1], 10));
  m = text.match(/בעוד\s*(\d+)\s*שבוע/);
  if(m) return addDays(now, parseInt(m[1], 10) * 7);
  return null;
}

function parseTimeFromText(text){
  let m = text.match(/(\d{1,2}):(\d{2})/);
  if(m) return { h: parseInt(m[1], 10), mnt: parseInt(m[2], 10) };
  m = text.match(/ב-?(\d{1,2})(?!\d)/);
  if(m){
    const h = parseInt(m[1], 10);
    if(h >= 0 && h <= 23) return { h, mnt: 0 };
  }
  if(text.includes('בבוקר')) return { h: 9, mnt: 0 };
  if(text.includes('אחרי הצהריים')) return { h: 16, mnt: 0 };
  if(text.includes('בצהריים')) return { h: 13, mnt: 0 };
  if(text.includes('בערב')) return { h: 19, mnt: 0 };
  if(text.includes('בלילה')) return { h: 21, mnt: 0 };
  return null;
}

function extractReminderText(original){
  const t = original.replace(/^(תזכיר לי|תזכיר|תזכורת|זכור לי|זכור)\s*/, '').trim();
  return t || original;
}

function processMessage(text){
  const trimmed = text.trim();

  if(/מה יש לי|מה מתוכנן|מה יש להיום/.test(trimmed)){
    const active = state.reminders.filter(r => !r.done);
    if(active.length === 0){
      return { reply: 'אין לך כרגע תזכורות פעילות.', add: [], complete_ids: [], delete_ids: [] };
    }
    const list = active
      .slice()
      .sort((a, b) => (a.datetime || '\uffff').localeCompare(b.datetime || '\uffff'))
      .map(r => '- ' + r.text + (r.datetime ? ' (' + whenLabel(r) + ')' : ''))
      .join('\n');
    return { reply: 'הנה מה שיש לך:\n' + list, add: [], complete_ids: [], delete_ids: [] };
  }

  const isDelete = /מחק|בטל/.test(trimmed);
  const isComplete = /סיימתי|בוצע|סמן/.test(trimmed);
  if(isDelete || isComplete){
    const match = state.reminders.find(r => !r.done && trimmed.includes(r.text.slice(0, 8)));
    if(match){
      if(isDelete) return { reply: `מחקתי: ${match.text}`, add: [], complete_ids: [], delete_ids: [match.id] };
      return { reply: `סימנתי כבוצע: ${match.text}`, add: [], complete_ids: [match.id], delete_ids: [] };
    }
    return { reply: 'לא מצאתי תזכורת שמתאימה לזה. אפשר לכתוב קצת יותר במדויק?', add: [], complete_ids: [], delete_ids: [] };
  }

  const date = parseDateFromText(trimmed);
  const time = parseTimeFromText(trimmed);
  const reminderText = extractReminderText(text);

  let datetime = null;
  let allDay = true;
  if(date){
    if(time){
      const d = new Date(date);
      d.setHours(time.h, time.mnt, 0, 0);
      datetime = d.toISOString();
      allDay = false;
    }else{
      datetime = date.toISOString();
      allDay = true;
    }
  }else if(time){
    const d = new Date();
    d.setHours(time.h, time.mnt, 0, 0);
    if(d.getTime() < Date.now()) d.setDate(d.getDate() + 1);
    datetime = d.toISOString();
    allDay = false;
  }

  const newReminder = { text: reminderText, datetime, allDay };
  return {
    reply: `הוספתי תזכורת: "${reminderText}"` + (datetime ? `, ${whenLabel(newReminder)}` : ' (בלי תאריך קבוע)'),
    add: [newReminder],
    complete_ids: [],
    delete_ids: []
  };
}

function applyActions(parsed){
  if(Array.isArray(parsed.add)){
    parsed.add.forEach(item => {
      if(item && item.text){
        state.reminders.push({
          id: uid(),
          text: item.text,
          datetime: item.datetime || null,
          allDay: !!item.allDay || !item.datetime,
          done: false
        });
      }
    });
  }
  if(Array.isArray(parsed.complete_ids)){
    parsed.complete_ids.forEach(id => {
      const r = state.reminders.find(x => x.id === id);
      if(r) r.done = true;
    });
  }
  if(Array.isArray(parsed.delete_ids)){
    state.reminders = state.reminders.filter(r => !parsed.delete_ids.includes(r.id));
  }
}

async function sendMessage(){
  const text = inputEl.value.trim();
  if(!text || sending) return;

  sending = true;
  sendBtn.disabled = true;
  inputEl.value = '';
  inputEl.style.height = 'auto';

  state.messages.push({ role: 'user', content: text });
  renderChat();
  saveState();
  showTyping(true);

  await new Promise(r => setTimeout(r, 350));

  try{
    const parsed = processMessage(text);
    applyActions(parsed);
    state.messages.push({ role: 'assistant', content: parsed.reply || 'סבבה, טופל.' });
  }catch(e){
    state.messages.push({ role: 'assistant', content: 'לא הצלחתי להבין את זה. אפשר לנסח מחדש? למשל: תזכיר לי מחר ב-9 להתקשר לרופא' });
  }

  showTyping(false);
  renderAll();
  saveState();
  sending = false;
  sendBtn.disabled = false;
}

sendBtn.addEventListener('click', sendMessage);
inputEl.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 100) + 'px';
});

resetBtn.addEventListener('click', async () => {
  if(!confirm('למחוק את כל השיחה והתזכורות?')) return;
  state = { messages: [], reminders: [], notified: [] };
  await saveState();
  renderAll();
});

/* ---- Calendar export (.ics) ---- */

function pad(n){ return String(n).padStart(2, '0'); }

function toFloatingLocal(d){
  return d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) + 'T' + pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds());
}

function toDateOnly(d){
  return d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate());
}

function escapeICS(str){
  return String(str).replace(/\\/g,'\\\\').replace(/,/g,'\\,').replace(/;/g,'\\;').replace(/\n/g,'\\n');
}

function reminderToVEvent(r){
  const now = new Date();
  const stamp = toFloatingLocal(now) + 'Z';
  let dtLines;
  if(r.allDay || !r.datetime){
    const base = r.datetime ? new Date(r.datetime) : now;
    const next = new Date(base);
    next.setDate(next.getDate() + 1);
    dtLines = `DTSTART;VALUE=DATE:${toDateOnly(base)}\r\nDTEND;VALUE=DATE:${toDateOnly(next)}`;
  }else{
    const start = new Date(r.datetime);
    const end = new Date(start.getTime() + 30*60000);
    dtLines = `DTSTART:${toFloatingLocal(start)}\r\nDTEND:${toFloatingLocal(end)}`;
  }
  return `BEGIN:VEVENT\r\nUID:${r.id}@my-assistant\r\nDTSTAMP:${stamp}\r\n${dtLines}\r\nSUMMARY:${escapeICS(r.text)}\r\n${alarmBlock(r)}\r\nEND:VEVENT`;
}

function alarmBlock(r){
  if(r.allDay || !r.datetime){
    const base = r.datetime ? new Date(r.datetime) : new Date();
    const alarmDate = new Date(base.getFullYear(), base.getMonth(), base.getDate(), 9, 0, 0);
    const utcTrigger = alarmDate.getUTCFullYear() + pad(alarmDate.getUTCMonth()+1) + pad(alarmDate.getUTCDate()) + 'T' + pad(alarmDate.getUTCHours()) + pad(alarmDate.getUTCMinutes()) + pad(alarmDate.getUTCSeconds()) + 'Z';
    return `BEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:${escapeICS(r.text)}\r\nTRIGGER;VALUE=DATE-TIME:${utcTrigger}\r\nEND:VALARM`;
  }
  return `BEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:${escapeICS(r.text)}\r\nTRIGGER:-PT0M\r\nEND:VALARM`;
}

function buildICS(reminders){
  const body = reminders.map(reminderToVEvent).join('\r\n');
  return `BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//My Assistant//HE\r\nCALSCALE:GREGORIAN\r\n${body}\r\nEND:VCALENDAR`;
}

function downloadICS(reminders, filename){
  const ics = buildICS(reminders);
  const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function whenLabel(r){
  if(!r.datetime) return 'ללא תאריך קבוע';
  const d = new Date(r.datetime);
  const dateTxt = d.toLocaleDateString('he-IL', {weekday:'short', day:'numeric', month:'short'});
  return r.allDay ? dateTxt : `${dateTxt}, ${formatTime(r.datetime)}`;
}

function calendarIconSvg(){
  return '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="3.5" y="5" width="17" height="15" rx="2.5" stroke="currentColor" stroke-width="1.6"/><path d="M3.5 9.5H20.5" stroke="currentColor" stroke-width="1.6"/></svg>';
}

function renderCalList(){
  calListContent.innerHTML = '';
  const active = state.reminders.slice().sort((a,b) => (a.datetime||'\uffff').localeCompare(b.datetime||'\uffff'));

  if(active.length === 0){
    const empty = document.createElement('div');
    empty.className = 'modal-empty';
    empty.textContent = 'עוד אין לך תזכורות. תבקש ממני משהו בצ׳אט ואז הן יופיעו כאן.';
    calListContent.appendChild(empty);
    return;
  }

  const addAllBtn = document.createElement('button');
  addAllBtn.className = 'add-all-btn';
  addAllBtn.textContent = 'הוסף את כל התזכורות ליומן בבת אחת';
  addAllBtn.addEventListener('click', () => downloadICS(active, 'תזכורות.ics'));
  calListContent.appendChild(addAllBtn);

  active.forEach(r => {
    const row = document.createElement('div');
    row.className = 'rlist-item';

    const textWrap = document.createElement('div');
    textWrap.className = 'rlist-text';
    const title = document.createElement('div');
    title.className = 'rlist-title' + (r.done ? ' done' : '');
    title.textContent = r.text;
    const when = document.createElement('div');
    when.className = 'rlist-when';
    when.textContent = whenLabel(r);
    textWrap.appendChild(title);
    textWrap.appendChild(when);

    const addBtn = document.createElement('button');
    addBtn.className = 'rlist-add';
    addBtn.innerHTML = calendarIconSvg() + '<span>הוסף</span>';
    addBtn.addEventListener('click', () => downloadICS([r], r.text.slice(0,30) + '.ics'));

    row.appendChild(textWrap);
    row.appendChild(addBtn);
    calListContent.appendChild(row);
  });
}

calBtn.addEventListener('click', () => {
  renderCalList();
  calModal.classList.remove('hidden');
});
calCloseBtn.addEventListener('click', () => calModal.classList.add('hidden'));
calModal.addEventListener('click', (e) => {
  if(e.target === calModal) calModal.classList.add('hidden');
});

/* ---- In-app alerts (works while this app/tab is open or recently active) ---- */

function updateNotifBtn(){
  if(!('Notification' in window)){
    notifBtn.style.opacity = '0.4';
    return;
  }
  notifBtn.style.opacity = Notification.permission === 'granted' ? '1' : '0.55';
}

notifBtn.addEventListener('click', async () => {
  if(!('Notification' in window)){
    alert('הדפדפן הזה לא תומך בהתראות. ההתראות דרך היומן (כפתור לוח השנה) עדיין יעבדו.');
    return;
  }
  if(Notification.permission === 'default'){
    await Notification.requestPermission();
  }
  updateNotifBtn();
  if(Notification.permission === 'granted'){
    new Notification('התראות פעילות', { body: 'אני אתריע לך כשתזכורת מגיעה, כל עוד האפליקציה פתוחה ברקע.' });
  }else if(Notification.permission === 'denied'){
    alert('ההתראות חסומות בהגדרות הדפדפן/האייפון. אפשר עדיין להשתמש בכפתור לוח השנה — שם לכל תזכורת יש כבר התראה מובנית של Calendar.');
  }
});

function reminderAlarmTime(r){
  if(r.allDay || !r.datetime){
    if(!r.datetime) return null;
    const base = new Date(r.datetime);
    return new Date(base.getFullYear(), base.getMonth(), base.getDate(), 9, 0, 0);
  }
  return new Date(r.datetime);
}

function checkDueReminders(){
  if(!('Notification' in window) || Notification.permission !== 'granted') return;
  const now = Date.now();
  let changed = false;
  state.reminders.forEach(r => {
    if(r.done || state.notified.includes(r.id)) return;
    const alarmAt = reminderAlarmTime(r);
    if(!alarmAt) return;
    const diff = now - alarmAt.getTime();
    if(diff >= 0 && diff < 5*60000){
      new Notification('תזכורת', { body: r.text });
      state.notified.push(r.id);
      changed = true;
    }
  });
  if(changed) saveState();
}

setInterval(checkDueReminders, 20000);
updateNotifBtn();

/* ---- Nicer home-screen icon (Add to Home Screen) ---- */

function generateAppIcon(){
  try{
    const c = document.createElement('canvas');
    c.width = 180; c.height = 180;
    const ctx = c.getContext('2d');
    const grad = ctx.createLinearGradient(0, 0, 180, 180);
    grad.addColorStop(0, '#3D6B5C');
    grad.addColorStop(1, '#274539');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 180, 180);
    ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    ctx.lineWidth = 7;
    ctx.beginPath();
    ctx.arc(90, 84, 46, 0, Math.PI*2);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(74, 78, 6, 0, Math.PI*2);
    ctx.arc(106, 78, 6, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(90, 90, 26, 0.25*Math.PI, 0.75*Math.PI);
    ctx.stroke();
    const link = document.createElement('link');
    link.rel = 'apple-touch-icon';
    link.href = c.toDataURL('image/png');
    document.head.appendChild(link);
  }catch(e){ /* icon is a nice-to-have, safe to skip on failure */ }
}
generateAppIcon();

loadState();
